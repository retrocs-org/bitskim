plugins { id 'com.android.application' }
def root = rootProject.projectDir.toPath().resolve('../..').normalize().toFile()
def tools = System.getenv('BITSKIM_ANDROID_TOOLS') ?: new File(System.getProperty('user.home'), 'Development/tools/android').path
android {
    namespace 'org.bitskim.android'
    compileSdk 37
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'org.bitskim.android'
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName new File(root, 'VERSION').text.trim()
        buildConfigField 'boolean', 'DISCOVERY', providers.gradleProperty('bitskimDiscovery').getOrElse('true')
    }
    buildFeatures { buildConfig = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug { storeFile new File(tools, 'debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    sourceSets {
        main {
            jniLibs.srcDirs = [new File(root, 'build/android/jniLibs')]
            assets.srcDirs += [new File(root, 'assets/themes'), new File(root, 'build/android/assets')]
        }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
}
layout.buildDirectory = new File(root, 'build/android/gradle-app')
dependencies { implementation 'androidx.core:core:1.17.0' }
